# Caddy + Caddy Log Interface — one docker compose stack, two containers
#
#   caddy : the web server / reverse proxy itself (host networking)
#   app   : the log interface — dashboards, log ingestion and Caddy config —
#           in a single container that rides alongside Caddy
#
# All storage is bind-mounted — no named volumes. Paths are set in .env:
#
#   DATA_PATH           the SQLite database (statistics, sessions, config history)
#   CADDY_CONF_PATH     directory holding the Caddyfile — read by caddy,
#                       written by app when you apply a change
#   CADDY_LOG_HOST_PATH Caddy's access logs — written by caddy, read by app
#   CADDY_DATA_PATH     Caddy's certificates and keys (caddy only)
#   CADDY_STATE_PATH    Caddy's autosaved config (caddy only)
#   CADDY_RUN_PATH      holds Caddy's admin socket, shared with app
#   MAXMIND_HOST_PATH   GeoLite2 .mmdb files (read-only)
#
# How changes reach Caddy: app talks to Caddy's admin API over a unix socket
# in CADDY_RUN_PATH. Nothing listens on a TCP admin port, and app never gets
# the Docker socket. Every change is validated by Caddy, applied with a
# zero-downtime reload (Caddy rolls back on failure), and only then written to
# the Caddyfile.
#
# Bind mounts keep the host's ownership: DATA_PATH, CADDY_CONF_PATH and
# CADDY_RUN_PATH must be owned by PUID:PGID (default 1000). See README §2.

name: caddy-log-interface

services:
  caddy:
    # Use a custom build here if you need plugins (e.g. a DNS provider for the
    # DNS-01 challenge): CADDY_IMAGE=my-caddy:latest
    image: ${CADDY_IMAGE:-caddy:2}
    container_name: caddy
    restart: unless-stopped
    # Host networking: Caddy binds 80/443 (and 443/udp for HTTP/3) directly on
    # the host and sees real client addresses. Published ports do not apply in
    # this mode, so there is no `ports:` section.
    network_mode: host
    cap_add:
      - NET_ADMIN # lets quic-go raise UDP buffer sizes for HTTP/3
    environment:
      # The admin API lives on a unix socket instead of TCP localhost:2019.
      # `|0222` lets app (a non-root user) connect to it; the socket's
      # directory (CADDY_RUN_PATH, mode 0700) is what keeps everyone else out.
      # Do not also set `admin` in the Caddyfile's global options — the
      # interface refuses changes that would move or disable it.
      CADDY_ADMIN: "unix//run/caddy/admin.sock|0222"
      TZ: ${TZ:-UTC}
    volumes:
      # A directory, not the single file, so saves can be atomic renames.
      - ${CADDY_CONF_PATH:-./caddy/conf}:/etc/caddy:ro
      - ${CADDY_DATA_PATH:-./caddy/data}:/data
      - ${CADDY_STATE_PATH:-./caddy/config}:/config
      - ${CADDY_LOG_HOST_PATH:-./caddy/logs}:/var/log/caddy
      - ${CADDY_RUN_PATH:-./caddy/run}:/run/caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # The published image. `:1` follows every 1.x release (new features and
    # fixes, no breaking changes); pin an exact version such as :1.0.0 with
    # APP_IMAGE in .env if you prefer to upgrade by hand.
    image: ${APP_IMAGE:-victimofareload/caddylogs:1}
    container_name: caddy-log-interface
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    # Bind mounts carry host ownership, so run as whoever owns DATA_PATH.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${CADDY_LOG_HOST_PATH:-./caddy/logs}:/logs:ro
      - ${MAXMIND_HOST_PATH:-./geoip}:/geoip:ro
      - ${CADDY_CONF_PATH:-./caddy/conf}:/caddy
      - ${CADDY_RUN_PATH:-./caddy/run}:/run/caddy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8899}:8899"
    # Hardening: no new privileges, read-only root fs, drop all capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # The image has a HEALTHCHECK (the web UI answering on /healthz); the
    # ingester runs as a supervised child process and is restarted if it dies.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
