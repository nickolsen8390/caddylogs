# Builds the container image.
#
#   push to main, pull request  -> build for linux/amd64 as a check (nothing is published)
#   push a tag like v1.2.3      -> build for amd64 + arm64, push to Docker Hub as
#                                  1.2.3, 1.2, 1 and latest, and refresh the
#                                  Docker Hub description from DOCKERHUB.md
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub user name
#   DOCKERHUB_TOKEN     a Docker Hub personal access token with Read, Write, Delete
#                       scope (Delete is needed to update the repository description)

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: victimofareload/caddylogs

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      # A release tag must match the version in app/package.json, so the
      # version the app reports and the image tag never disagree.
      - name: Check the tag matches app/package.json
        if: env.RELEASE == 'true'
        run: |
          pkg="$(node -p "require('./app/package.json').version")"
          if [ "v${pkg}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/package.json version ${pkg}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Log in to Docker Hub
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, and push if this is a release
        uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Provenance and a software bill of materials, attached to released
          # images so users can see how and from what they were built.
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.RELEASE == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the Docker Hub description
        if: env.RELEASE == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
          short-description: Dashboard for Caddy access logs, with a web editor for the Caddyfile and zero-downtime reloads
