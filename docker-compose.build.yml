# Build the interface from this source tree instead of pulling the published
# image. Use it together with the main compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Everything else (mounts, settings, hardening) comes from docker-compose.yml.

services:
  app:
    image: caddylogs:local
    build:
      context: ./app
      dockerfile: Dockerfile
